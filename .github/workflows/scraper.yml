name: OK.ru Stream Scraper

on:
  schedule:
    # Her 6 saatte bir otomatik çalıştır (cron zamanlaması)
    - cron: '0 */6 * * *'
  workflow_dispatch: # GitHub arayüzünden manuel "Run workflow" tuşuna basarak da çalıştırabilirsiniz

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
    - name: Repoyu Koda Çek (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwright Tarayıcılarını Kur
      run: playwright install chromium

    - name: Scraper Scriptini Çalıştır
      run: python scraper.py
