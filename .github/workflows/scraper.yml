name: OK.ru Stream Scraper

on:
  schedule:
    # Hatalı olan 'x' karakteri düzeltildi (Her 6 saatte bir çalışır)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Manuel tetikleme için

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Repoyu Koda Çek (Checkout)
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Playwright Tarayıcılarını Kur
      run: playwright install chromium

    - name: Scraper Scriptini Çalıştır
      run: python scraper.py

    - name: Değişiklikleri Depoya Otomatik Kaydet (Commit & Push)
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add streams.txt
        git diff --staged --quiet || (git commit -m "Otomatik yayın linkleri güncellendi [skip ci]" && git push)
